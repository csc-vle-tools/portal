<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Passport Photo Sheet Generator - CSC VLE Tools</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1b2430;--mu:#5d6b7a;--bd:#d5dce4;--pr:#0f766e;--pr2:#f0fdf4;--er:#b3261e;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif}
header{background:var(--pr);color:var(--on);padding:14px 16px;text-align:center}
header h1{margin:0;font-size:1.2rem}header p{margin:2px 0 8px;font-size:.82rem;opacity:.9}
.lg button{background:transparent;color:var(--on);border:1px solid var(--on);padding:5px 14px;margin:0 2px;border-radius:16px;cursor:pointer;font:inherit;font-size:.82rem}
.lg button.a{background:var(--on);color:var(--pr)}
main{max-width:900px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
h2.t{font-size:1.0rem;margin:0 0 12px;color:var(--pr)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:block;font-size:.8rem;color:var(--mu);margin-bottom:3px;font-weight:600}
input,select{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.btn{background:var(--pr);color:var(--on);border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;font-size:.92rem}
.btn.s{background:var(--card);color:var(--pr);border:1px solid var(--pr)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#out{display:none}

.paper{background:#fff;color:#111;border:1px solid var(--bd);border-radius:6px;padding:10mm;width:210mm;min-height:297mm;margin:0 auto;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;justify-content:flex-start;}
.photo-slot{width:35mm;height:45mm;border:1px solid #999;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#eee;}
.photo-slot.stamp{width:25mm;height:35mm;}
.photo-slot img{width:100%;height:100%;object-fit:cover;}
.framed img{border:5px solid #222;}

@page{size:A4;margin:0}
@media print{body{background:#fff}header,#form,.noprint{display:none!important}main{padding:0}.paper{border:0;padding:10mm;width:210mm;height:297mm;position:absolute;left:0;top:0;page-break-after:avoid}}
</style>
</head>
<body>
<header>
  <div style="display:flex; justify-content:space-between; align-items:center; max-width:900px; margin:0 auto; padding-bottom:6px;">
    <a href="index.html" style="color:#fff; text-decoration:none; font-weight:bold; font-size:0.9rem;"><i class="fa fa-home"></i> Portal Home</a>
    <div><h1 style="display:inline;" data-i="Passport Photo Sheet Generator|पासपोर्ट फोटो शीट जनरेटर"></h1></div>
    <div style="width:90px;"></div>
  </div>
  <p data-i="Generate multi-photo sheets on A4 paper instantly|A4 पेपर पर तुरंत मल्टी-फोटो शीट तैयार करें"></p>
  <div class="lg"><button data-l="en">English</button><button data-l="hi">हिंदी</button><button data-l="both" class="a">English + हिंदी</button></div>
</header>
<main>
<div id="form">
  <div class="card">
    <h2 class="t">1. <span data-i="Upload & Configure Photo|फोटो अपलोड व सेटिंग"></span></h2>
    <div class="g">
      <div>
        <label data-i="Upload Photo|फोटो अपलोड करें"></label>
        <input type="file" id="uploadImg" accept="image/*">
      </div>
      <div>
        <label data-i="Photo Size Type|फोटो आकार का प्रकार"></label>
        <select id="photoSize">
          <option value="passport">Standard Passport (3.5 x 4.5 cm)</option>
          <option value="stamp">Stamp Size (2.5 x 3.5 cm)</option>
        </select>
      </div>
      <div>
        <label data-i="Border Frame|बॉर्डर फ्रेम"></label>
        <select id="frameStyle">
          <option value="unframed">No Border (बिना बॉर्डर)</option>
          <option value="framed">5px Dark Border (5px काला बॉर्डर)</option>
        </select>
      </div>
      <div>
        <label data-i="Number of Copies|कॉपी की संख्या"></label>
        <select id="copyCount">
          <option value="8">8 Copies (8 प्रतियां)</option>
          <option value="16">16 Copies (16 प्रतियां)</option>
          <option value="24">24 Copies (24 प्रतियां - Full Sheet)</option>
        </select>
      </div>
    </div>
  </div>
  <div class="row">
    <button class="btn" id="gen" data-i="Generate Sheet Preview|शीट पूर्वावलोकन देखें"></button>
  </div>
</div>

<div id="out">
  <div class="card noprint">
    <div class="row">
      <button class="btn" id="pdf" data-i="📄 Save as A4 PDF|📄 A4 पीडीएफ सेव करें"></button>
      <button class="btn s" onclick="window.print()" data-i="🖨 Print Sheet|🖨 शीट प्रिंट करें"></button>
      <button class="btn s" id="back" data-i="← Upload New Photo|← नई फोटो अपलोड करें"></button>
    </div>
  </div>
  <div class="paper" id="paper"></div>
</div>
</main>
<script>
var lang="both", $=function(id){return document.getElementById(id)}, imgData="";
function L(s){var p=s.split("|");return p.length<2?s:(lang=="en"?p[0]:lang=="hi"?p[1]:p[0]+" / "+p[1])}
function apply(){
  document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=L(e.dataset.i)});
  document.querySelectorAll(".lg button").forEach(function(b){b.className=b.dataset.l==lang?"a":""});
}
$("uploadImg").onchange = function(e){
  let f = e.target.files[0];
  if(f){ let r = new FileReader(); r.onload = function(evt){ imgData = evt.target.result; }; r.readAsDataURL(f); }
};
function generate(){
  if(!imgData){ alert("Please upload a photo first! | कृपया पहले फोटो अपलोड करें!"); return; }
  let size = $("photoSize").value;
  let framed = $("frameStyle").value;
  let count = parseInt($("copyCount").value);
  let html = "";
  for(let i=0; i<count; i++){
    html += `<div class="photo-slot ${size} ${framed}"><img src="${imgData}"></div>`;
  }
  $("paper").innerHTML = html;
  $("form").style.display="none";
  $("out").style.display="block";
  window.scrollTo(0,0);
}
document.querySelector(".lg").addEventListener("click",function(e){var l=e.target.dataset.l;if(l){lang=l;apply();}});
$("gen").onclick = generate;
$("back").onclick = function(){$("out").style.display="none";$("form").style.display="block";};
$("pdf").onclick = function(){window.print();};
apply();
</script>
</body>
</html>
