<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Modern Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a81c42" />
      <stop offset="100%" stop-color="#5e0c23" />
    </linearGradient>
    <!-- Cyan Accent Glow -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
  </defs>

  <!-- Rounded Box Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Top Cyan Glow Border Accent -->
  <rect x="0" y="0" width="512" height="24" rx="12" fill="url(#accentGrad)" />

  <!-- Bold Central Monogram "CSC" -->
  <text x="50%" y="54%" font-family="&#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="220" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="4">
    CSC
  </text>

  <!-- "VLE" Sub-Tag for High Distinction -->
  <text x="50%" y="82%" font-family="&#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#00f2fe" text-anchor="middle" dominant-baseline="middle" letter-spacing="8">
    VLE
  </text>
</svg>