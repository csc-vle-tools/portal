<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rent & Agreement Generator - CSC VLE Tools</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1b2430;--mu:#5d6b7a;--bd:#d5dce4;--pr:#1a4f9c;--pr2:#e8f0fe;--er:#b3261e;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif}
header{background:var(--pr);color:var(--on);padding:14px 16px;text-align:center}
header h1{margin:0;font-size:1.2rem}header p{margin:2px 0 8px;font-size:.82rem;opacity:.9}
.lg button{background:transparent;color:var(--on);border:1px solid var(--on);padding:5px 14px;margin:0 2px;border-radius:16px;cursor:pointer;font:inherit;font-size:.82rem}
.lg button.a{background:var(--on);color:var(--pr)}
main{max-width:900px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
h2.t{font-size:1.0rem;margin:0 0 12px;color:var(--pr)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:block;font-size:.8rem;color:var(--mu);margin-bottom:3px;font-weight:600}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pr);border-color:transparent}
.full{grid-column:1/-1}
.btn{background:var(--pr);color:var(--on);border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;font-size:.92rem}
.btn.s{background:var(--card);color:var(--pr);border:1px solid var(--pr)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#out{display:none}.hintbar{font-size:.8rem;color:var(--mu);margin:0 0 8px}

.paper{background:#fff;color:#111;border:1px solid var(--bd);border-radius:6px;padding:26px;font:14px/1.6 "Segoe UI","Noto Sans Devanagari",Arial,sans-serif;overflow-x:auto;-webkit-print-color-adjust:exact;print-color-adjust:exact;position:relative;width:210mm;min-height:297mm;margin:0 auto;}
.agreement-header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid var(--pr); padding-bottom: 10px; }
.agreement-header h1 { font-size: 1.5rem; color: var(--pr); text-transform: uppercase; margin: 0; }
.section-title { background: var(--pr2); color: var(--pr); padding: 4px 10px; font-weight: bold; border-left: 4px solid var(--pr); margin: 15px 0 8px 0; font-size: 0.95rem; text-transform: uppercase; }
.agreement-body p { margin-bottom: 10px; text-align: justify; }
.sig-box { display: flex; justify-content: space-between; margin-top: 40px; }

@page{size:A4;margin:0}
@media print{body{background:#fff}header,#form,.noprint{display:none!important}main{padding:0}.paper{border:0;padding:20mm;outline:none;position:absolute;left:0;top:0;width:210mm;min-height:297mm;page-break-after:avoid}}
</style>
</head>
<body>
<header>
  <div style="display:flex; justify-content:space-between; align-items:center; max-width:900px; margin:0 auto; padding-bottom:6px;">
    <a href="index.html" style="color:#fff; text-decoration:none; font-weight:bold; font-size:0.9rem;"><i class="fa fa-home"></i> Portal Home</a>
    <div><h1 style="display:inline;" data-i="Rent & Service Agreement Generator|किराया व सेवा समझौता जनरेटर"></h1></div>
    <div style="width:90px;"></div>
  </div>
  <p data-i="Create professional legal agreement formats instantly|पेशेवर कानूनी समझौता प्रारूप तुरंत तैयार करें"></p>
  <div class="lg"><button data-l="en">English</button><button data-l="hi">हिंदी</button><button data-l="both" class="a">English + हिंदी</button></div>
</header>
<main>
<div id="form">
  <div class="card">
    <h2 class="t">1. <span data-i="Agreement Type|समझौते का प्रकार"></span></h2>
    <div class="g">
      <div class="full">
        <label data-i="Select Template|प्रारूप चुनें"></label>
        <select id="agreementType">
          <option value="residential">Residential House Rent Agreement | आवासीय मकान किरायानामा</option>
          <option value="commercial">Commercial Shop Lease Agreement | व्यावसायिक दुकान लीज समझौता</option>
          <option value="service">General Service Agreement | सामान्य सेवा समझौता</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <h2 class="t">2. <span data-i="Party Details|पक्षकारों का विवरण"></span></h2>
    <div class="g">
      <div><label data-i="First Party (Landowner/Licensor) Name|प्रथम पक्ष (मकान मालिक) का नाम"></label><input id="p1Name" type="text" value="Shri Ramesh Kumar"></div>
      <div><label data-i="First Party Address|प्रथम पक्ष का पता"></label><input id="p1Addr" type="text" value="Civil Road, Rohtak, Haryana"></div>
      <div><label data-i="Second Party (Tenant/Licensee) Name|द्वितीय पक्ष (किराएदार) का नाम"></label><input id="p2Name" type="text" value="Shri Anil Verma"></div>
      <div><label data-i="Second Party Address|द्वितीय पक्ष का पता"></label><input id="p2Addr" type="text" value="Model Town, Rohtak, Haryana"></div>
    </div>
  </div>

  <div class="card">
    <h2 class="t">3. <span data-i="Property & Financial Terms|संपत्ति व वित्तीय शर्तें"></span></h2>
    <div class="g">
      <div class="full"><label data-i="Property Address / Description|संपत्ति का पूरा पता / विवरण"></label><input id="propAddr" type="text" value="House No. 45, Sector 2, Rohtak, Haryana"></div>
      <div><label data-i="Monthly Rent (₹)|मासिक किराया (₹)"></label><input id="rentAmount" type="text" value="12,000/-"></div>
      <div><label data-i="Security Deposit (₹)|सुरक्षा राशि / एडवांस् (₹)"></label><input id="secDeposit" type="text" value="25,000/-"></div>
      <div><label data-i="Agreement Duration|समझौते की अवधि"></label><input id="duration" type="text" value="11 Months / 11 महीने"></div>
      <div><label data-i="Starting Date|प्रारंभ तिथि"></label><input id="startDate" type="date" value="2026-11-01"></div>
    </div>
  </div>

  <div class="row">
    <button class="btn" id="gen" data-i="Generate Agreement Preview|समझौता पूर्वावलोकन देखें"></button>
  </div>
</div>

<div id="out">
  <div class="card noprint">
    <div class="row">
      <button class="btn" id="pdf" data-i="📄 Save as A4 PDF|📄 A4 पीडीएफ सेव करें"></button>
      <button class="btn s" onclick="window.print()" data-i="🖨 Print Agreement|🖨 समझौता प्रिंट करें"></button>
      <button class="btn s" id="back" data-i="← Edit Details|← विवरण बदलें"></button>
    </div>
  </div>
  <div class="paper" id="paper">
    <div class="agreement-header">
      <h1 id="outTitle">RENT AGREEMENT</h1>
    </div>
    <div class="agreement-body" id="previewContent"></div>
  </div>
</div>
</main>
<script>
var lang="both", $=function(id){return document.getElementById(id)};
function L(s){var p=s.split("|");return p.length<2?s:(lang=="en"?p[0]:lang=="hi"?p[1]:p[0]+" / "+p[1])}
function apply(){
  document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=L(e.dataset.i)});
  document.querySelectorAll(".lg button").forEach(function(b){b.className=b.dataset.l==lang?"a":""});
}
function generate(){
  let type = $("agreementType").value;
  let title = type === 'commercial' ? "COMMERCIAL LEASE AGREEMENT / व्यावसायिक लीज समझौता" : (type === 'service' ? "SERVICE AGREEMENT / सेवा समझौता" : "HOUSE RENT AGREEMENT / मकान किरायानामा");
  $("outTitle").textContent = title;

  let html = `
    <p>This Rent Agreement is made and executed on this date by and between:</p>
    <p><strong>1. First Party (Landlord):</strong> ${$("p1Name").value}, resident of ${$("p1Addr").value} (Hereinafter called the "First Party / Owner").</p>
    <p><strong>2. Second Party (Tenant):</strong> ${$("p2Name").value}, resident of ${$("p2Addr").value} (Hereinafter called the "Second Party / Tenant").</p>
    
    <div class="section-title">Terms & Conditions / नियम व शर्तें</div>
    <p>1. That the First Party is the lawful owner of the property located at <strong>${$("propAddr").value}</strong>.</p>
    <p>2. That the monthly rent of the said property is fixed at <strong>₹${$("rentAmount").value}</strong>, payable on or before the 7th day of each calendar month.</p>
    <p>3. That the Second Party has paid an interest-free security deposit of <strong>₹${$("secDeposit").value}</strong> to the First Party.</p>
    <p>4. That this agreement is valid for a period of <strong>${$("duration").value}</strong> starting from <strong>${$("startDate").value}</strong>.</p>
    <p>5. That electricity and water charges shall be paid extra by the Second Party as per actual meter readings.</p>

    <div class="sig-box">
      <div>
        <br><br>
        ___________________________<br>
        <strong>First Party (Landlord Signature)</strong>
      </div>
      <div>
        <br><br>
        ___________________________<br>
        <strong>Second Party (Tenant Signature)</strong>
      </div>
    </div>
  `;
  $("previewContent").innerHTML = html;
  $("form").style.display="none";
  $("out").style.display="block";
  window.scrollTo(0,0);
}
document.querySelector(".lg").addEventListener("click",function(e){var l=e.target.dataset.l;if(l){lang=l;apply();}});
$("gen").onclick=generate;
$("back").onclick=function(){$("out").style.display="none";$("form").style.display="block";};
$("pdf").onclick=function(){window.print();};
apply();
</script>
</body>
</html>
