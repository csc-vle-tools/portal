<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bill Payment Receipt Generator - CSC VLE Tools</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1b2430;--mu:#5d6b7a;--bd:#d5dce4;--pr:#059669;--pr2:#ecfdf5;--er:#b3261e;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif}
header{background:var(--pr);color:var(--on);padding:14px 16px;text-align:center}
header h1{margin:0;font-size:1.2rem}header p{margin:2px 0 8px;font-size:.82rem;opacity:.9}
.lg button{background:transparent;color:var(--on);border:1px solid var(--on);padding:5px 14px;margin:0 2px;border-radius:16px;cursor:pointer;font:inherit;font-size:.82rem}
.lg button.a{background:var(--on);color:var(--pr)}
main{max-width:900px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
h2.t{font-size:1.0rem;margin:0 0 12px;color:var(--pr)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:block;font-size:.8rem;color:var(--mu);margin-bottom:3px;font-weight:600}
input,select{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.btn{background:var(--pr);color:var(--on);border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;font-size:.92rem}
.btn.s{background:var(--card);color:var(--pr);border:1px solid var(--pr)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#out{display:none}

.paper{background:#fff;color:#111;border:1px solid var(--bd);border-radius:6px;padding:10mm;width:210mm;min-height:297mm;margin:0 auto;display:flex;flex-direction:column;gap:15px;}
.receipt-box{border:2px dashed var(--pr);padding:12px;border-radius:8px;background:#fafafa;}
.receipt-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:0.85rem;}
.receipt-table td{border:1px solid #ccc;padding:5px 8px;}

@page{size:A4;margin:0}
@media print{body{background:#fff}header,#form,.noprint{display:none!important}main{padding:0}.paper{border:0;padding:10mm;width:210mm;height:297mm;position:absolute;left:0;top:0;page-break-after:avoid}}
</style>
</head>
<body>
<header>
  <div style="display:flex; justify-content:space-between; align-items:center; max-width:900px; margin:0 auto; padding-bottom:6px;">
    <a href="index.html" style="color:#fff; text-decoration:none; font-weight:bold; font-size:0.9rem;"><i class="fa fa-home"></i> Portal Home</a>
    <div><h1 style="display:inline;" data-i="Utility Bill Receipt Generator|यूटिलिटी बिल भुगतान रसीद जनरेटर"></h1></div>
    <div style="width:90px;"></div>
  </div>
  <p data-i="Print dual bill payment receipts on a single A4 sheet|एक ही A4 शीट पर दोहरी बिल भुगतान रसीद प्रिंट करें"></p>
  <div class="lg"><button data-l="en">English</button><button data-l="hi">हिंदी</button><button data-l="both" class="a">English + हिंदी</button></div>
</header>
<main>
<div id="form">
  <div class="card">
    <h2 class="t">1. <span data-i="Bill & Consumer Details|बिल व उपभोक्ता विवरण"></span></h2>
    <div class="g">
      <div>
        <label data-i="Bill Type|बिल का प्रकार"></label>
        <select id="billType">
          <option value="Electricity Bill">Electricity Bill (बिजली बिल)</option>
          <option value="Water Bill">Water Bill (पानी का बिल)</option>
          <option value="Broadband / Fastag">Broadband / Fastag / Other</option>
        </select>
      </div>
      <div><label data-i="Consumer Name|उपभोक्ता का नाम"></label><input id="custName" type="text" value="Rajesh Kumar"></div>
      <div><label data-i="Consumer / Account No.|खाता / उपभोक्ता संख्या"></label><input id="accNo" type="text" value="1004589623"></div>
      <div><label data-i="Bill Amount (₹)|बिल राशि (₹)"></label><input id="billAmt" type="number" value="1450"></div>
    </div>
  </div>
  <div class="row">
    <button class="btn" id="gen" data-i="Generate Dual Receipts|दोहरी रसीदें तैयार करें"></button>
  </div>
</div>

<div id="out">
  <div class="card noprint">
    <div class="row">
      <button class="btn" id="pdf" data-i="📄 Save as A4 PDF|📄 A4 पीडीएफ सेव करें"></button>
      <button class="btn s" onclick="window.print()" data-i="🖨 Print Dual Receipts|🖨 रसीदें प्रिंट करें"></button>
      <button class="btn s" id="back" data-i="← Edit Details|← विवरण बदलें"></button>
    </div>
  </div>
  <div class="paper" id="paper">
    <!-- Receipt 1: Customer Copy -->
    <div class="receipt-box" id="r1"></div>
    <hr style="border:1px dashed #aaa; margin:10px 0;">
    <!-- Receipt 2: Office Copy -->
    <div class="receipt-box" id="r2"></div>
  </div>
</div>
</main>
<script>
var lang="both", $=function(id){return document.getElementById(id)};
function L(s){var p=s.split("|");return p.length<2?s:(lang=="en"?p[0]:lang=="hi"?p[1]:p[0]+" / "+p[1])}
function apply(){
  document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=L(e.dataset.i)});
  document.querySelectorAll(".lg button").forEach(function(b){b.className=b.dataset.l==lang?"a":""});
}
function buildReceipt(copyType){
  let bType = $("billType").value;
  let cName = $("custName").value;
  let acc = $("accNo").value;
  let amt = $("billAmt").value;
  let date = new Date().toLocaleString();

  return `
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--pr); padding-bottom:6px;">
      <h3 style="margin:0; color:var(--pr); font-size:1rem;">CSC VLE DIGITAL SEVA KENDRA - RECEIPT</h3>
      <span style="font-size:0.8rem; font-weight:bold; background:var(--pr2); padding:2px 6px; border-radius:4px;">${copyType}</span>
    </div>
    <table class="receipt-table" style="margin-top:10px;">
      <tr><td><strong>Bill Type / बिल प्रकार:</strong> ${bType}</td><td><strong>Date / दिनांक:</strong> ${date}</td></tr>
      <tr><td><strong>Consumer Name / उपभोक्ता:</strong> ${cName}</td><td><strong>Account No / खाता सं.:</strong> ${acc}</td></tr>
      <tr><td colspan="2"><strong>Paid Amount / भुगतान राशि:</strong> ₹ ${amt}/- (Paid Successfully)</td></tr>
    </table>
    <div style="display:flex; justify-content:space-between; margin-top:20px; font-size:0.8rem;">
      <span>Customer Signature</span>
      <span>Authorized VLE Signature</span>
    </div>
  `;
}
function generate(){
  $("r1").innerHTML = buildReceipt("CUSTOMER COPY");
  $("r2").innerHTML = buildReceipt("OFFICE COPY");
  $("form").style.display="none";
  $("out").style.display="block";
  window.scrollTo(0,0);
}
document.querySelector(".lg").addEventListener("click",function(e){var l=e.target.dataset.l;if(l){lang=l;apply();}});
$("gen").onclick = generate;
$("back").onclick = function(){$("out").style.display="none";$("form").style.display="block";};
$("pdf").onclick = function(){window.print();};
apply();
</script>
</body>
</html>
