<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGPA to Percentage Calculator - Smart CSC Tools</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: #a81c42;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-top: 4px solid #a81c42;
        }

        .header h1 {
            color: #a81c42;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .calc-card {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .calc-card h3 {
            font-size: 16px;
            color: #a81c42;
            margin-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 8px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #444;
            margin-bottom: 5px;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn-action {
            background-color: #a81c42;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .btn-action:hover {
            background-color: #871433;
        }

        .result-box {
            margin-top: 20px;
            background: #fdf3f5;
            border: 1px solid #f2c2cd;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .result-box h4 {
            color: #a81c42;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .result-item {
            background: #fff;
            padding: 12px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .result-item span {
            display: block;
            font-size: 20px;
            font-weight: bold;
            color: #222;
        }

        .result-item label {
            font-size: 11px;
            color: #666;
            margin-top: 3px;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
        
        <div class="header">
            <h1><i class="fa-solid fa-graduation-cap"></i> CGPA & Percentage Calculator</h1>
            <p>Convert your cumulative grade point average (CGPA) into accurate percentage scores instantly.</p>
        </div>

        <div class="calc-card">
            <h3>Enter Your CGPA Details</h3>
            <div class="input-group">
                <label>Overall CGPA (e.g., 8.25)</label>
                <input type="number" id="cgpaInput" step="0.01" max="10" placeholder="Enter CGPA out of 10">
            </div>

            <div class="input-group">
                <label>University Formula (Multiplier)</label>
                <select id="formulaMultiplier" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; font-size:14px;">
                    <option value="9.5">Multiply by 9.5 (Standard CBSE / AICTE)</option>
                    <option value="10">Multiply by 10 (Direct Percentage)</option>
                </select>
            </div>

            <button class="btn-action" onclick="calculatePercentage()"><i class="fa-solid fa-calculator"></i> Convert to Percentage</button>

            <div id="resultArea" class="result-box">
                <h4>Calculation Result</h4>
                <div class="result-grid">
                    <div class="result-item">
                        <span id="resCgpa">0.00</span>
                        <label>Entered CGPA</label>
                    </div>
                    <div class="result-item">
                        <span id="resPercentage">0.00%</span>
                        <label>Equivalent Percentage</label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calculatePercentage() {
            const cgpa = parseFloat(document.getElementById('cgpaInput').value);
            const multiplier = parseFloat(document.getElementById('formulaMultiplier').value);

            if (isNaN(cgpa) || cgpa < 0 || cgpa > 10) {
                alert('Please enter a valid CGPA between 0 and 10.');
                return;
            }

            const percentage = cgpa * multiplier;

            document.getElementById('resCgpa').innerText = cgpa.toFixed(2);
            document.getElementById('resPercentage').innerText = percentage.toFixed(2) + '%';
            document.getElementById('resultArea').style.display = 'block';
        }
    </script>
</body>
</html>
